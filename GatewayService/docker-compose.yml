services:
  stakeholders:
    build: ../Stakeholders
    restart: unless-stopped
    environment:
      MONGO_URI: ${STAKEHOLDERS_MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      - soa

  blogs:
    build: ../Blogs
    restart: unless-stopped
    environment:
      PORT: "8082"
      MONGO_URI: ${BLOGS_MONGO_URI}
      MONGO_DATABASE: ${BLOGS_MONGO_DATABASE}
    networks:
      - soa

  tours:
    build: ../TourService
    restart: unless-stopped
    environment:
      MongoDbSettings__ConnectionString: ${TOURS_MONGO_URI}
      MongoDbSettings__DatabaseName: ${TOURS_MONGO_DATABASE}
      ASPNETCORE_URLS: "http://+:5281"
    networks:
      - soa

  gateway:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      STAKEHOLDERS_URL: http://stakeholders:8081
      BLOGS_URL: http://blogs:8082
      TOURS_URL: http://tours:5281
      #FRONTEND_ORIGIN: http://localhost:5173
      FRONTEND_ORIGIN: https://alphabetical-fitting-ruby-membrane.trycloudflare.com
    depends_on:
      - stakeholders
      - blogs
      - tours
    networks:
      - soa

  frontend:
    build:
      context: ../frontend
      args:
        #VITE_API_BASE_URL: http://localhost:8080/api
        VITE_API_BASE_URL: https://fairfield-gmt-sudden-serving.trycloudflare.com/api
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - gateway
    networks:
      - soa

  loki:
    image: grafana/loki:3.7.0
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks:
      - soa

  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    command: run /etc/alloy/config.alloy
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - soa

  grafana:
    image: grafana/grafana:12.4.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/datasources.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
    depends_on:
      - loki
    networks:
      - soa

networks:
  soa:
    name: soa-network
    driver: bridge

volumes:
  grafana-data:
  loki-data:
